<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Products | Golden Hypermarket Pala</title>
  <meta name="description" content="Search across 120+ authentic Kerala groceries, farm fresh produce, fish, meat, and home appliances with 2-hr delivery in Pala.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Main Unified Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
</head>
<body>

  <!-- Injected Header Container -->
  <div id="site-header-container"></div>

  <main class="main-content">
    <div class="container">
      
      <!-- Breadcrumbs -->
      <nav class="breadcrumbs-bar" aria-label="Breadcrumb">
        <ul class="breadcrumbs-list">
          <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
          <li class="sep"><i class="fa-solid fa-chevron-right"></i></li>
          <li><a href="category.html?cat=grocery">Products</a></li>
          <li class="sep"><i class="fa-solid fa-chevron-right"></i></li>
          <li class="current">Search Results</li>
        </ul>
      </nav>

      <!-- Search Results Header Bar -->
      <div class="search-header-bar">
        <div class="search-header-flex">
          <div>
            <h1 class="search-title">
              Search Results for: <span class="search-query-highlight" id="searchQueryLabel">"All Products"</span>
            </h1>
            <p class="search-count-desc">
              Showing <strong id="searchFoundCount" class="search-count-number">0</strong> matching items in Pala store catalog
            </p>
          </div>
          
          <div class="sort-select-wrapper">
            <label for="searchSortSelect"><i class="fa-solid fa-arrow-down-short-wide"></i> Sort By:</label>
            <select id="searchSortSelect" class="sort-select">
              <option value="featured">Best Matches</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
              <option value="discount">Biggest Savings</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Search Results Grid -->
      <div class="products-catalog-grid search-grid-wrap" id="searchResultsGrid">
        <!-- Injected via JS -->
      </div>

    </div>
  </main>

  <!-- Injected Footer Container -->
  <div id="site-footer-container"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const query = params.get('q') || '';
      const cat = params.get('cat') || 'all';

      // Initialize components
      SiteComponents.init({ page: 'search', category: cat });

      document.title = query ? `Search: "${query}" | Golden Hypermarket Pala` : 'Search Products | Golden Hypermarket Pala';

      const queryLabel = document.getElementById('searchQueryLabel');
      if (queryLabel) {
        queryLabel.textContent = query ? `"${query}"` : 'All Departments';
      }

      // Perform Search
      let matches = siteData.searchProducts(query, cat);

      const countEl = document.getElementById('searchFoundCount');
      if (countEl) countEl.textContent = matches.length;

      const grid = document.getElementById('searchResultsGrid');
      const sortSelect = document.getElementById('searchSortSelect');

      function renderResults(list) {
        if (!grid) return;

        if (list.length === 0) {
          grid.innerHTML = `
            <div class="no-products-box">
              <i class="fa-solid fa-magnifying-glass search-empty-icon"></i>
              <h3 class="no-products-title">No products found matching "${escapeHtml(query)}"</h3>
              <p class="search-empty-desc">
                We couldn't find exact matches. Try searching for general terms like <em>Rice, Coconut Oil, Ghee, Fish, Chicken, Mango, Tea, Banana</em>.
              </p>
              <div class="search-empty-actions">
                <a href="category.html?cat=grocery" class="btn-primary-add-cart btn-search-grocery">Browse Grocery</a>
                <a href="category.html?cat=produce" class="btn-primary-add-cart btn-search-produce">Fresh Vegetables</a>
                <a href="category.html?cat=all&deals=1" class="btn-primary-add-cart btn-search-deals">Weekend Deals</a>
              </div>
            </div>
          `;
          return;
        }

        grid.innerHTML = list.map(p => CartManager.renderProductCard(p)).join('');
        CartManager.syncBadges();
      }

      function applySort() {
        const val = sortSelect.value;
        let sorted = [...matches];
        if (val === 'price-asc') sorted.sort((a, b) => a.price - b.price);
        else if (val === 'price-desc') sorted.sort((a, b) => b.price - a.price);
        else if (val === 'rating') sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        else if (val === 'discount') {
          sorted.sort((a, b) => {
            const discA = a.oldPrice ? (a.oldPrice - a.price) / a.oldPrice : 0;
            const discB = b.oldPrice ? (b.oldPrice - b.price) / b.oldPrice : 0;
            return discB - discA;
          });
        }
        renderResults(sorted);
      }

      if (sortSelect) {
        sortSelect.addEventListener('change', applySort);
      }

      renderResults(matches);
    });
  </script>
</body>
</html>
